<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e4d2"/>
      <stop offset="1" stop-color="#dcc4a6"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dfa8"/>
      <stop offset="1" stop-color="#eac784"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#5b3a29" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- plate -->
  <ellipse cx="200" cy="292" rx="160" ry="44" fill="#fffdf9" filter="url(#s)"/>
  <ellipse cx="200" cy="288" rx="120" ry="28" fill="none" stroke="#ece2d6" stroke-width="3"/>
  <!-- cake slice -->
  <g filter="url(#s)">
    <path d="M110 280 L110 200 L290 170 L290 250 Z" fill="url(#cheese)"/>
    <path d="M110 200 L290 170 L250 150 L95 190 Z" fill="#b8763f"/>
    <path d="M110 200 L95 190 L95 270 L110 280 Z" fill="#e4bb76"/>
    <path d="M110 280 L290 250 L290 262 L110 292 Z" fill="#9c6a3e"/>
  </g>
  <!-- berry and mint -->
  <circle cx="190" cy="160" r="16" fill="#c25b4e"/>
  <circle cx="184" cy="154" r="4" fill="#fff" opacity="0.5"/>
  <path d="M200 146 q14 -16 26 -6 q-12 14 -26 6z" fill="#7d8f69"/>
  <!-- cream -->
  <ellipse cx="320" cy="270" rx="26" ry="12" fill="#fffaf1"/>
  <path d="M302 268 q18 -30 36 0z" fill="#fffaf1"/>
  <!-- fork -->
  <g transform="rotate(-12 80 320)">
    <rect x="30" y="318" width="110" height="8" rx="4" fill="#cfc4b8"/>
    <path d="M140 312 h40 v20 h-40z" fill="#cfc4b8"/>
    <path d="M180 313 h22 M180 319 h22 M180 325 h22 M180 331 h22" stroke="#cfc4b8" stroke-width="3"/>
  </g>
</svg>
