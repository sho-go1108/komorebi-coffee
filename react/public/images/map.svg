<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" font-family="'Zen Kaku Gothic New', sans-serif">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#3e2c23" stroke-opacity="0.04"/>
    </pattern>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3e2c23" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="#f7f1e6"/>
  <rect width="500" height="500" fill="url(#grid)"/>

  <!-- blocks -->
  <g fill="#ece2d2">
    <rect x="20" y="20" width="150" height="110" rx="6"/>
    <rect x="215" y="20" width="110" height="110" rx="6"/>
    <rect x="370" y="20" width="110" height="200" rx="6"/>
    <rect x="215" y="175" width="110" height="105" rx="6"/>
    <rect x="370" y="325" width="110" height="155" rx="6"/>
    <rect x="215" y="325" width="110" height="155" rx="6"/>
  </g>

  <!-- park -->
  <rect x="20" y="175" width="150" height="105" rx="6" fill="#d4dfc4"/>
  <g fill="#9fb48a">
    <circle cx="55" cy="210" r="14"/><circle cx="90" cy="240" r="18"/><circle cx="135" cy="205" r="12"/><circle cx="140" cy="255" r="10"/>
  </g>
  <text x="95" y="272" font-size="13" fill="#6b7d58" text-anchor="middle">○○公園</text>

  <!-- river -->
  <path d="M0 470 C120 440 240 500 500 455" fill="none" stroke="#c6dbe0" stroke-width="18"/>

  <!-- roads -->
  <g fill="#fffdf9" stroke="#e2d6c5" stroke-width="1.5">
    <rect x="-5" y="140" width="510" height="26"/>
    <rect x="-5" y="290" width="510" height="26"/>
    <rect x="180" y="-5" width="26" height="510"/>
    <rect x="335" y="-5" width="26" height="430"/>
  </g>
  <text x="440" y="157" font-size="11" fill="#a39080" text-anchor="middle">けやき通り</text>

  <!-- railway -->
  <g>
    <rect x="-5" y="388" width="350" height="12" fill="#b9aa98"/>
    <path d="M0 394 H345" stroke="#fffdf9" stroke-width="2" stroke-dasharray="10 8"/>
  </g>

  <!-- station -->
  <g filter="url(#s)">
    <rect x="30" y="350" width="120" height="34" rx="8" fill="#7d8f69"/>
    <text x="90" y="373" font-size="15" font-weight="700" fill="#fffdf9" text-anchor="middle">○○駅 東口</text>
  </g>

  <!-- walking route -->
  <path d="M150 367 H193 V303 H262 V262" fill="none" stroke="#c98e4a" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>
  <text x="225" y="350" font-size="12" fill="#c98e4a" text-anchor="middle">徒歩5分</text>

  <!-- shop -->
  <rect x="235" y="195" width="70" height="60" rx="8" fill="#e4cfb2"/>
  <g filter="url(#s)">
    <path d="M270 252 c-22 -26 -32 -40 -32 -56 a32 32 0 0 1 64 0 c0 16 -10 30 -32 56z" fill="#5b3a29"/>
    <circle cx="270" cy="196" r="12" fill="#fffdf9"/>
  </g>
  <g filter="url(#s)">
    <rect x="200" y="96" width="140" height="34" rx="17" fill="#fffdf9"/>
    <text x="270" y="119" font-size="16" fill="#3e2c23" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="500">Komorebi Coffee</text>
  </g>
  <path d="M262 130 l8 10 l8 -10z" fill="#fffdf9"/>

  <!-- compass -->
  <g transform="translate(450 470)" fill="#a39080">
    <path d="M0 -18 L6 0 L0 -4 L-6 0Z"/>
    <text y="12" font-size="11" text-anchor="middle">N</text>
  </g>
</svg>
