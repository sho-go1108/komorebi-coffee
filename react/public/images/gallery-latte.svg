<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5d43"/>
      <stop offset="1" stop-color="#5e3d2c"/>
    </linearGradient>
    <radialGradient id="coffee" cx="0.45" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#c8935c"/>
      <stop offset="0.6" stop-color="#a26a3c"/>
      <stop offset="1" stop-color="#6e4329"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="10" dy="16" stdDeviation="14" flood-color="#2a1a12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#wood)"/>
  <g stroke="#4f3324" stroke-opacity="0.25" stroke-width="2" fill="none">
    <path d="M0 90 C150 80 300 105 600 85"/>
    <path d="M0 230 C200 215 380 245 600 225"/>
    <path d="M0 380 C170 395 400 365 600 385"/>
    <path d="M0 520 C220 505 360 535 600 515"/>
  </g>
  <!-- light -->
  <ellipse cx="460" cy="110" rx="200" ry="120" fill="#ffe6b8" opacity="0.12"/>
  <!-- saucer -->
  <circle cx="290" cy="310" r="190" fill="#f4ece2" filter="url(#shadow)"/>
  <circle cx="290" cy="310" r="150" fill="none" stroke="#e5d8c8" stroke-width="3"/>
  <!-- handle -->
  <rect x="410" y="285" width="95" height="50" rx="25" fill="#fffdf9" filter="url(#shadow)"/>
  <!-- cup -->
  <circle cx="290" cy="310" r="140" fill="#fffdf9" filter="url(#shadow)"/>
  <circle cx="290" cy="310" r="118" fill="url(#coffee)"/>
  <!-- latte art: tulip -->
  <g fill="#fdf5ea">
    <path d="M290 375 c-55 0 -78 -30 -78 -46 c30 12 60 14 78 6 c18 8 48 6 78 -6 c0 16 -23 46 -78 46z"/>
    <path d="M290 330 c-48 0 -66 -26 -66 -40 c26 10 52 12 66 5 c14 7 40 5 66 -5 c0 14 -18 40 -66 40z"/>
    <path d="M290 290 c-38 0 -52 -22 -52 -34 c14 -26 40 -32 52 -32 c12 0 38 6 52 32 c0 12 -14 34 -52 34z"/>
    <rect x="287" y="215" width="6" height="170" rx="3"/>
  </g>
  <!-- spoon -->
  <g transform="rotate(-28 160 470)" filter="url(#shadow)">
    <rect x="70" y="462" width="150" height="12" rx="6" fill="#d9cfc4"/>
    <ellipse cx="235" cy="468" rx="30" ry="20" fill="#e6ddd3"/>
  </g>
</svg>
