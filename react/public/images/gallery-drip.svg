<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4b089"/>
      <stop offset="1" stop-color="#8f654a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffdf9" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#fffdf9" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fffdf9" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- kettle -->
  <g fill="#3e2c23">
    <path d="M40 60 h90 a10 10 0 0 1 10 10 v60 a10 10 0 0 1 -10 10 h-90 a10 10 0 0 1 -10 -10 v-60 a10 10 0 0 1 10 -10z"/>
    <path d="M140 110 C170 110 175 90 205 118" fill="none" stroke="#3e2c23" stroke-width="8" stroke-linecap="round"/>
    <rect x="70" y="48" width="30" height="12" rx="4"/>
  </g>
  <!-- water stream -->
  <path d="M206 120 C210 135 210 150 210 162" stroke="#f3e6d3" stroke-width="3" fill="none" opacity="0.9"/>
  <!-- dripper -->
  <path d="M150 165 h120 l-34 66 h-52 z" fill="#fffdf9"/>
  <path d="M164 175 h92 l-26 50 h-40 z" fill="#e8d6bd"/>
  <ellipse cx="210" cy="178" rx="44" ry="6" fill="#7a4b30"/>
  <rect x="176" y="231" width="68" height="10" rx="3" fill="#fffdf9"/>
  <!-- drip -->
  <circle cx="210" cy="252" r="3" fill="#5b3a29"/>
  <!-- server -->
  <path d="M160 245 h100 v90 a30 30 0 0 1 -30 30 h-40 a30 30 0 0 1 -30 -30z" fill="url(#glass)" stroke="#fffdf9" stroke-opacity="0.7" stroke-width="3"/>
  <path d="M162 300 h96 v35 a28 28 0 0 1 -28 28 h-40 a28 28 0 0 1 -28 -28z" fill="#5b3a29" opacity="0.9"/>
  <path d="M260 262 c22 0 22 50 0 50" fill="none" stroke="#fffdf9" stroke-opacity="0.7" stroke-width="5"/>
  <!-- steam -->
  <g fill="none" stroke="#fffdf9" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round">
    <path d="M195 160 c-8 -12 8 -18 0 -30"/>
    <path d="M225 160 c-8 -12 8 -18 0 -30"/>
  </g>
</svg>
